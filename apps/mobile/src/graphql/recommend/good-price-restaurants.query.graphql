# restaurants 테이블은 @graphql max_rows=3000으로 상향돼 있어(F3-1,
# supabase/migrations/20260902000000_restaurants_graphql_max_rows.sql) first를
# 지정하지 않아도 지역 내 전체 결과를 받는다. price_menus는 jsonb라 서버 측
# 가격 정렬은 여전히 안 되고, 클라이언트가 전체 결과를 받아 정렬한다.
query GoodPriceRestaurants($regionSido: String!) {
  restaurantsCollection(
    filter: { source: { eq: "good_price" }, region_sido: { eq: $regionSido } }
    orderBy: [{ name: AscNullsLast }]
  ) {
    edges {
      node {
        id
        name
        address
        category
        price_menus
        latitude
        longitude
      }
    }
  }
}

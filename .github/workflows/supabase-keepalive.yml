name: Supabase Keepalive

on:
  schedule:
    # Every 3 days at 00:00 UTC — well within Supabase's 7-day pause threshold
    - cron: "0 0 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Query a real table: /auth/v1/health never reaches Postgres, so Supabase
      # doesn't count it as project activity and still flags the project for pausing
      - name: Ping Supabase database via REST
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/badges?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ne 200 ]; then
            echo "Unexpected response from Supabase"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

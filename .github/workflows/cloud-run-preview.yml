name: Cloud Run Preview Deploy

# eas-build-android:preview 라벨과 동일한 패턴 — PR에 `cloud-run:preview` 라벨을 붙이면
# apps/server를 Cloud Run에 "프리뷰 리비전"으로 배포한다.
# --tag + --no-traffic으로 배포하므로 운영 트래픽(yeobi-nyamnyam-server 기존 URL)에는
# 영향이 없고, 태그가 붙은 별도 URL로만 접근 가능하다 (리뷰/QA 용도).
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  GCP_PROJECT: yeobi-nyamnyam-508106
  GCP_REGION: asia-northeast3
  SERVICE_NAME: yeobi-nyamnyam-server

jobs:
  deploy-preview:
    if: github.event.label.name == 'cloud-run:preview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy preview revision
        id: deploy
        run: |
          TAG="pr-${{ github.event.pull_request.number }}"
          gcloud run deploy "$SERVICE_NAME" \
            --source=. \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT" \
            --tag="$TAG" \
            --no-traffic \
            --quiet \
            --format=json > deploy_result.json

          URL=$(python3 -c "
import json
with open('deploy_result.json') as f:
    d = json.load(f)
for t in d['status']['traffic']:
    if t.get('tag') == '$TAG':
        print(t['url'])
        break
")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Cloud Run 프리뷰 배포 완료 (운영 트래픽 영향 없음)\n\n${{ steps.deploy.outputs.url }}`,
            })

name: Cleanup Unconsented Users

on:
  schedule:
    # 매일 UTC 18:00 (KST 03:00) — 약관 미동의 상태로 24시간(기본값) 넘게 방치된
    # auth.users를 정리한다 (apps/server/src/scripts/cleanupUnconsentedUsers.ts)
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cleanup
        run: pnpm --filter server cleanup:unconsented-users
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
